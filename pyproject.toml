[project]
name = "csso"
version = "1.43.0"
description = "Sistema de Gestao da CSSO/Sisa (UFVJM) - Modulo Adicional Ocupacional"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "docxtpl>=0.19",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.7",
    "cryptography>=44.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pymupdf>=1.25",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app/servicos"]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
