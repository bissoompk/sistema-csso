{#- A marca do sistema CSSO/Sisa. Um caminho só, `evenodd`, `currentColor`: a
    folha e a faixa são FURO, não peça branca, então o mesmo desenho serve na
    lateral escura (chapa branca), sobre papel (chapa azul) e no preto e branco
    da impressora. O `viewBox` de 24 é o tamanho mínimo de uso — nenhuma aresta
    cai abaixo de um pixel ali. O argumento inteiro está em `csso.css`, seção
    "a marca do sistema"; não repetir aqui é de propósito, para não haver duas
    versões da mesma justificativa. -#}
